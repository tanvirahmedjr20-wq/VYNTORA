
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101828">
<title>VYNTORA | Online Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
header{background:#101828;color:white;padding:20px 16px;text-align:center}
header h1{margin:0;font-size:30px;letter-spacing:2px}
header p{margin:8px 0 0}
nav{display:flex;justify-content:center;gap:18px;padding:14px;background:white}
nav a{color:#101828;text-decoration:none;font-weight:bold}
main{max-width:900px;margin:auto;padding:18px}
.hero{background:#e0eaff;padding:25px 18px;border-radius:14px;text-align:center}
.hero h2{margin-top:0}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin:15px 0}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:white;border-radius:12px;padding:15px;overflow-wrap:anywhere}
.price{color:#087443;font-size:18px;font-weight:bold}
.code{color:#667085;font-size:13px}
footer{text-align:center;padding:25px;color:#667085}
@media(min-width:600px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>VYNTORA</h1>
<p>আপনার পছন্দের অনলাইন শপ</p>
</header>

<nav>
<a href="./index.html">Home</a>
<a href="./login.html">Admin Login</a>
<a href="./admin.html">Admin Panel</a>
</nav>

<main>
<section class="hero">
<h2>VYNTORA-তে স্বাগতম!</h2>
<p>আপনার পছন্দের পণ্য কিনুন সহজেই।</p>
</section>

<input id="search" type="search" placeholder="পণ্য খুঁজুন..." oninput="showProducts()">

<h2>আমাদের পণ্য</h2>
<div id="status">পণ্য লোড হচ্ছে...</div>
<div class="products" id="products"></div>
</main>

<footer>© 2026 VYNTORA. All rights reserved.</footer>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxB_M-l-95Unr6SlPCLIh5EejCpIjQfC8",
  authDomain: "vyntora-life-style.firebaseapp.com",
  projectId: "vyntora-life-style",
  storageBucket: "vyntora-life-style.firebasestorage.app",
  messagingSenderId: "1071925178210",
  appId: "1:1071925178210:web:8eccb0fc36633ebdb1463b",
  measurementId: "G-8RTHL8C4W7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let products = [];

window.showProducts = function(){
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = products.filter(p =>
    String(p.name || "").toLowerCase().includes(q) ||
    String(p.code || "").toLowerCase().includes(q)
  );

  document.getElementById("products").innerHTML = filtered.map(p => `
    <article class="item">
      <h3>${escapeHTML(p.name || "পণ্য")}</h3>
      <p class="price">৳${Number(p.price || 0).toLocaleString("en-BD")}</p>
      <p class="code">Product Code: ${escapeHTML(p.code || "-")}</p>
    </article>
  `).join("");

  if (!filtered.length) {
    document.getElementById("products").innerHTML =
      "<p>এখনো কোনো পণ্য পাওয়া যায়নি।</p>";
  }
};

function escapeHTML(value){
  const el = document.createElement("span");
  el.textContent = String(value);
  return el.innerHTML;
}

async function loadProducts(){
  try {
    const snapshot = await getDocs(collection(db, "products"));
    products = snapshot.docs.map(doc => doc.data());
    document.getElementById("status").textContent =
      products.length ? "" : "এখনো পণ্য যোগ করা হয়নি।";
    showProducts();
  } catch(error) {
    console.error(error);
    document.getElementById("status").textContent =
      "পণ্য লোড হয়নি। Firebase Rules ও সংযোগ পরীক্ষা করুন।";
  }
}

loadProducts();
</script>
</body>
</html>
